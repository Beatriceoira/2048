<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f4;--panel:#c9cfdb;--cell:#dde1ea;--text:#1d2433;--muted:#5b657a;--btn:#1d2433;--btnt:#fff;
--t2:#fff;--t2t:#1d2433;--t4:#ffe9b8;--t8:#ffc27a;--t16:#ff9b5e;--t32:#ff7a5c;--t64:#ee4f6b;--t128:#7bd3c1;--t256:#4fb8d6;--t512:#4a8fe0;--t1024:#6a6de0;--t2048:#a455e0;--tbig:#1d2433}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--panel:#232836;--cell:#2d3446;--text:#eceef4;--muted:#98a1b8;--btn:#eceef4;--btnt:#14171f;--t2:#eceef4;--t2t:#14171f}}
:root[data-theme="dark"]{--bg:#14171f;--panel:#232836;--cell:#2d3446;--text:#eceef4;--muted:#98a1b8;--btn:#eceef4;--btnt:#14171f;--t2:#eceef4;--t2t:#14171f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none}
body{display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:420px}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
h1{margin:0;font-size:56px;line-height:1;font-weight:800;letter-spacing:-2px}
.scores{display:flex;gap:8px}
.score{background:var(--panel);border-radius:8px;padding:6px 12px;text-align:center;min-width:64px}
.score small{display:block;font-size:11px;color:var(--muted)}
.score b{font-size:18px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}
button{background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid #4a8fe0;outline-offset:2px}
.board{position:relative;background:var(--panel);border-radius:12px;padding:10px;aspect-ratio:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;width:100%;height:100%}
.slot{background:var(--cell);border-radius:8px}
.tiles{position:absolute;inset:10px}
.tile{position:absolute;width:calc((100% - 30px)/4);height:calc((100% - 30px)/4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(22px,8vw,36px);transition:left .12s ease,top .12s ease;background:var(--tbig);color:#fff}
.tile.new{animation:pop .15s ease}
.tile.merged{animation:bump .18s ease}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.15)}}
.v2{background:var(--t2);color:var(--t2t)}.v4{background:var(--t4);color:#1d2433}.v8{background:var(--t8);color:#1d2433}
.v16{background:var(--t16);color:#1d2433}.v32{background:var(--t32)}.v64{background:var(--t64)}
.v128{background:var(--t128);color:#1d2433;font-size:clamp(20px,7vw,32px)}.v256{background:var(--t256);color:#1d2433;font-size:clamp(20px,7vw,32px)}
.v512{background:var(--t512);font-size:clamp(20px,7vw,32px)}.v1024{background:var(--t1024);font-size:clamp(16px,5.6vw,26px)}
.v2048{background:var(--t2048);font-size:clamp(16px,5.6vw,26px)}.vbig{font-size:clamp(14px,5vw,22px)}
.over{position:absolute;inset:0;border-radius:12px;background:rgba(20,23,31,.72);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.over.show{display:flex}
.over h2{margin:0;font-size:32px}
.over button{background:#fff;color:#1d2433}
p.help{color:var(--muted);font-size:13px;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){.tile,.tile.new,.tile.merged{animation:none;transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><small>Score</small><b id="score">0</b></div>
      <div class="score"><small>Best</small><b id="best">0</b></div>
    </div>
  </header>
  <div class="bar"><span>Merge tiles to reach 2048.</span><button id="new">New game</button></div>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="over" id="over"><h2 id="msg">Game over</h2><button id="again">Try again</button></div>
  </div>
  <p class="help">Arrow keys or WASD to move. On a touchscreen, swipe the board.</p>
</div>
<script>
(function(){
  var N=4, grid, score, best=0, won=false, over=false, nextId=1;
  var tilesEl=document.getElementById('tiles'), scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  var overEl=document.getElementById('over'), msgEl=document.getElementById('msg');
  var els={};

  try{best=parseInt(localStorage.getItem('best2048'))||0;}catch(e){}
  bestEl.textContent=best;

  var g=document.getElementById('grid');
  for(var i=0;i<N*N;i++){var s=document.createElement('div');s.className='slot';g.appendChild(s);}

  function empty(){var a=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!grid[r][c])a.push([r,c]);return a;}
  function spawn(){
    var e=empty(); if(!e.length)return;
    var p=e[Math.floor(Math.random()*e.length)];
    grid[p[0]][p[1]]={id:nextId++,v:Math.random()<0.9?2:4,isNew:true};
  }
  function start(){
    grid=[];for(var r=0;r<N;r++){grid.push([null,null,null,null]);}
    score=0;won=false;over=false;overEl.classList.remove('show');
    tilesEl.innerHTML='';els={};
    spawn();spawn();render();
  }
  function pos(r,c){return {left:'calc('+c+' * (100% - 30px) / 4 + '+(c*10)+'px)',top:'calc('+r+' * (100% - 30px) / 4 + '+(r*10)+'px)'};}
  function cls(v){return 'tile v'+(v<=2048?v:'big');}
  function render(){
    var seen={};
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      var t=grid[r][c]; if(!t)continue;
      seen[t.id]=1;
      var el=els[t.id];
      if(!el){el=document.createElement('div');els[t.id]=el;tilesEl.appendChild(el);
        el.className=cls(t.v)+(t.isNew?' new':'');}
      var p=pos(r,c);el.style.left=p.left;el.style.top=p.top;
      if(el.textContent!==String(t.v)){el.textContent=t.v;el.className=cls(t.v)+(t.merged?' merged':'');}
      else if(t.merged){el.className=cls(t.v)+' merged';}
      t.isNew=false;t.merged=false;
    }
    for(var id in els){if(!seen[id]){els[id].remove();delete els[id];}}
    scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('best2048',best);}catch(e){}}
  }
  // Slide a single line toward index 0. Returns {line, moved, gained}.
  function slide(line){
    var tiles=line.filter(Boolean),out=[],gained=0;
    for(var i=0;i<tiles.length;i++){
      if(i+1<tiles.length&&tiles[i].v===tiles[i+1].v){
        // keep the first tile's id, drop the second so it visually slides into place
        var m=tiles[i];m.v*=2;m.merged=true;gained+=m.v;out.push(m);
        var gone=tiles[i+1];if(els[gone.id]){els[gone.id].remove();delete els[gone.id];}
        i++;
      } else out.push(tiles[i]);
    }
    while(out.length<N)out.push(null);
    var moved=false;for(var j=0;j<N;j++){if(out[j]!==line[j])moved=true;}
    return {line:out,moved:moved,gained:gained};
  }
  function move(dir){ // 0 left,1 up,2 right,3 down
    if(over)return;
    var moved=false,gained=0;
    for(var k=0;k<N;k++){
      var line=[];
      for(var j=0;j<N;j++){
        var r=dir%2===0?k:(dir===1?j:N-1-j);
        var c=dir%2===1?k:(dir===0?j:N-1-j);
        line.push(grid[r][c]);
      }
      var res=slide(line);
      if(res.moved)moved=true;gained+=res.gained;
      for(var j2=0;j2<N;j2++){
        var r2=dir%2===0?k:(dir===1?j2:N-1-j2);
        var c2=dir%2===1?k:(dir===0?j2:N-1-j2);
        grid[r2][c2]=res.line[j2];
      }
    }
    if(!moved)return;
    score+=gained;spawn();render();check();
  }
  function check(){
    if(!won){for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(grid[r][c]&&grid[r][c].v>=2048){won=true;msgEl.textContent='You made 2048!';overEl.classList.add('show');document.getElementById('again').textContent='Keep playing';over=false;winPause=true;return;}}
    if(empty().length)return;
    for(var r2=0;r2<N;r2++)for(var c2=0;c2<N;c2++){
      var v=grid[r2][c2].v;
      if(c2+1<N&&grid[r2][c2+1].v===v)return;
      if(r2+1<N&&grid[r2+1][c2].v===v)return;
    }
    over=true;msgEl.textContent='Game over';document.getElementById('again').textContent='Try again';overEl.classList.add('show');winPause=false;
  }
  var winPause=false;
  document.getElementById('again').onclick=function(){
    if(winPause&&!over){overEl.classList.remove('show');winPause=false;}else start();
  };
  document.getElementById('new').onclick=start;

  var keys={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3,A:0,W:1,D:2,S:3};
  document.addEventListener('keydown',function(e){
    if(e.key
